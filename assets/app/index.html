<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>SHACL report</title>
    <link rel="stylesheet" href="/assets/vendor/tabulator/tabulator.min.css" />
    <link rel="stylesheet" href="/assets/app/styles.css" />
  </head>
  <body>
    <header class="appbar">
      <button id="toggle-filters" class="icon-btn only-mobile" aria-label="Show filters" title="Filters">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4" /></svg>
      </button>
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="2" y="2" width="28" height="28" rx="8" class="logo-bg" />
          <path d="M10 16.5l4 4 8-9" class="logo-check" />
        </svg>
        <div class="brand-text">
          <span class="brand-name">shacl-report <span id="version" class="version"></span></span>
          <span id="file-name" class="file-name"></span>
        </div>
      </div>
      <div class="appbar-actions">
        <button id="open-files" class="btn hidden" title="Open another report">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7a2 2 0 012-2h4l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H6a2 2 0 01-2-2z" /></svg>
          <span class="hide-mobile">Open report</span>
        </button>
        <div class="menu">
          <button id="export-btn" class="btn" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14" /></svg>
            <span class="hide-mobile">Export</span>
          </button>
          <div id="export-menu" class="menu-pop hidden" role="menu">
            <button data-export="csv" role="menuitem">CSV of shown results</button>
            <button data-export="html" role="menuitem" class="server-only hidden">Standalone HTML report</button>
          </div>
        </div>
        <button id="theme-btn" class="icon-btn" aria-label="Switch theme" title="Switch theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        </button>
      </div>
    </header>

    <div class="layout">
      <aside id="filters" class="filters" aria-label="Filters">
        <div class="filters-head only-mobile">
          <h2>Filters</h2>
          <button id="close-filters" class="icon-btn" aria-label="Close filters">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <section class="filter-section">
          <h3>Severity</h3>
          <div id="severity-filter" class="check-list"></div>
        </section>
        <section class="filter-section">
          <h3>Problem type</h3>
          <ul id="problem-filter" class="facet"></ul>
        </section>
        <section class="filter-section">
          <h3>Shape</h3>
          <input id="shape-search" class="facet-search hidden" type="search" placeholder="Find a shape…" />
          <ul id="shape-filter" class="facet"></ul>
        </section>
        <button id="reset-filters" class="link-btn hidden">Reset all filters</button>
      </aside>
      <div id="scrim" class="scrim hidden"></div>

      <main id="content" class="content">
        <section id="welcome" class="welcome hidden"></section>

        <section id="summary" class="summary hidden">
          <div id="status-card" class="card status-card"></div>
          <div id="stat-cards" class="stat-cards"></div>
          <div class="card chart-card">
            <h3>Most affected shapes</h3>
            <div id="top-shapes" class="bars"></div>
          </div>
          <div class="card chart-card">
            <h3>Most common problems</h3>
            <div id="top-problems" class="bars"></div>
          </div>
        </section>

        <section id="results" class="results hidden">
          <div class="toolbar">
            <div class="search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" /><path d="M20 20l-4.5-4.5" /></svg>
              <input id="search" type="search" placeholder="Search resources, paths, values, messages…" aria-label="Search results" />
              <kbd class="hide-mobile">/</kbd>
            </div>
            <div class="toolbar-group">
              <span class="toolbar-label hide-mobile">Group by</span>
              <div id="group-by" class="segmented" role="radiogroup" aria-label="Group by">
                <button data-value="shape" class="active" role="radio">Shape</button>
                <button data-value="resource" role="radio">Resource</button>
                <button data-value="problem" role="radio">Problem</button>
                <button data-value="none" role="radio">None</button>
              </div>
            </div>
            <div id="view-toggle" class="segmented" role="radiogroup" aria-label="View">
              <button data-value="cards" class="active" role="radio" title="Card view">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="5" rx="1.5" /><rect x="4" y="14" width="16" height="5" rx="1.5" /></svg>
              </button>
              <button data-value="table" role="radio" title="Table view">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16M10 6v12" /></svg>
              </button>
            </div>
          </div>
          <div class="result-meta">
            <span id="result-count"></span>
            <div id="active-filters" class="active-filters"></div>
          </div>
          <div id="groups" class="groups"></div>
          <div id="table-wrap" class="table-wrap hidden"><div id="table"></div></div>
        </section>
      </main>

      <aside id="drawer" class="drawer" aria-label="Result details" aria-hidden="true">
        <div class="drawer-head">
          <div class="drawer-nav">
            <button id="prev-result" class="icon-btn" aria-label="Previous result" title="Previous (k)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>
            </button>
            <span id="drawer-pos" class="drawer-pos"></span>
            <button id="next-result" class="icon-btn" aria-label="Next result" title="Next (j)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
            </button>
          </div>
          <button id="close-drawer" class="icon-btn" aria-label="Close details" title="Close (Esc)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <div id="drawer-body" class="drawer-body"></div>
      </aside>
    </div>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card">
        <div class="modal-head">
          <h2 id="modal-title">Open a SHACL validation report</h2>
          <button id="close-modal" class="icon-btn" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <div id="open-form-slot"></div>
      </div>
    </div>

    <template id="open-form-tpl">
      <form class="open-form">
        <p class="open-intro">Drop the report your validator produced. Adding the shapes and data is optional, but it lets the viewer name every shape and show the resource behind each problem.</p>
        <div class="drop-grid">
          <label class="drop" data-slot="report">
            <input type="file" accept=".ttl,.nt,.rdf,.owl,.xml,.trig,.nq,.gz" hidden />
            <span class="drop-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z" /><path d="M14 3v5h5M10 13l2 2 4-4" /></svg></span>
            <span class="drop-title">Validation report <em>required</em></span>
            <span class="drop-hint">Drop a file or click to browse</span>
            <span class="drop-files"></span>
          </label>
          <label class="drop" data-slot="shapes">
            <input type="file" accept=".ttl,.nt,.rdf,.owl,.xml,.trig,.nq,.gz" multiple hidden />
            <span class="drop-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5" /><circle cx="16.5" cy="16.5" r="3.5" /><path d="M16.5 4l3.5 6h-7z" /></svg></span>
            <span class="drop-title">Shapes <em>optional</em></span>
            <span class="drop-hint">Names shapes and shows broken rules</span>
            <span class="drop-files"></span>
          </label>
          <label class="drop" data-slot="data">
            <input type="file" accept=".ttl,.nt,.rdf,.owl,.xml,.trig,.nq,.gz" multiple hidden />
            <span class="drop-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3" /><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3" /></svg></span>
            <span class="drop-title">Data <em>optional</em></span>
            <span class="drop-hint">Shows the triples behind each problem</span>
            <span class="drop-files"></span>
          </label>
        </div>
        <details class="path-load">
          <summary>Large files? Load them from disk by path instead</summary>
          <div class="path-fields">
            <label>Report path<input name="path-report" type="text" placeholder="/path/to/report.ttl" /></label>
            <label>Shapes paths (comma-separated)<input name="path-shapes" type="text" placeholder="/path/to/shapes.ttl" /></label>
            <label>Data paths (comma-separated)<input name="path-data" type="text" placeholder="/path/to/data.ttl" /></label>
          </div>
        </details>
        <div class="form-foot">
          <span class="form-msg" role="status"></span>
          <button type="submit" class="btn primary" disabled>Open report</button>
        </div>
      </form>
    </template>

    <div id="toast" class="toast hidden" role="status"></div>
    <div id="loading" class="loading hidden"><div class="spinner"></div><p id="loading-msg">Loading report…</p></div>

    <script src="/assets/vendor/tabulator/tabulator.min.js"></script>
    <!--REPORT-DATA-->
    <script src="/assets/app/app.js"></script>
  </body>
</html>
