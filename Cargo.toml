[package]
name = "shacl-report"
version = "0.1.0"
edition = "2024"
description = "Validate RDF with SHACL, or read any validator's report, and explore it in a readable web view or a CI-friendly HTML report"
authors = ["Mathias Vanden Auweele <mathias@matdata.eu>"]
license = "Apache-2.0"
homepage = "https://github.com/Matdata-eu/shacl-report"
repository = "https://github.com/Matdata-eu/shacl-report"
categories = ["command-line-utilities"]
keywords = ["rdf", "shacl", "validation", "sparql", "linked-data"]
readme = "README.md"

[dependencies]
anyhow = "1"
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json", "query"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
oxrdf = "0.3"
oxrdfxml = "0.2"
oxttl = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "sync", "time"] }
webbrowser = "1"
base64 = "0.22"
ureq = "3"
spareval = { version = "0.2", features = ["sep-0006"] }
spargebra = "0.4"
oxsdatatypes = "0.2"
regex = "1"
getrandom = "0.4"

[build-dependencies]
serde_json = "1"
ureq = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
