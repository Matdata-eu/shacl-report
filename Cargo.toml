[package]
name = "shacl-report"
version = "0.1.0"
edition = "2024"
description = "Turn SHACL validation reports from any validator into a readable, filterable web view and a CI-friendly HTML report"
authors = ["Mathias Vanden Auweele <mathias@matdata.eu>"]
license = "Apache-2.0"
homepage = "https://github.com/Matdata-eu/shacl-report"
repository = "https://github.com/Matdata-eu/shacl-report"
categories = ["command-line-utilities"]
keywords = ["rdf", "shacl", "validation", "linked-data", "report"]
readme = "README.md"

[dependencies]
anyhow = "1"
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json", "query"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
oxrdf = "0.3"
oxrdfxml = "0.2"
oxttl = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "sync"] }
webbrowser = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
